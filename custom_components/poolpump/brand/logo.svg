<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#7dd3fc;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <!-- Fond rond bleu -->
  <circle cx="128" cy="128" r="118" fill="url(#bgGrad)" />

  <!-- Corps principal de la pompe (boîtier rectangulaire arrondi) -->
  <rect x="52" y="98" width="130" height="80" rx="14" ry="14" fill="url(#bodyGrad)" stroke="#bae6fd" stroke-width="2.5"/>

  <!-- Moteur (cercle droit) -->
  <circle cx="193" cy="138" r="30" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2.5"/>
  <circle cx="193" cy="138" r="18" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2"/>
  <circle cx="193" cy="138" r="7" fill="#0ea5e9"/>

  <!-- Ailettes du moteur -->
  <line x1="193" y1="112" x2="193" y2="120" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>
  <line x1="193" y1="156" x2="193" y2="164" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>
  <line x1="167" y1="138" x2="175" y2="138" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>
  <line x1="175" y1="119" x2="180" y2="125" stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="175" y1="157" x2="180" y2="151" stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Tuyau entrée (gauche, vertical) -->
  <rect x="88" y="64" width="22" height="36" rx="6" fill="#bae6fd" stroke="#7dd3fc" stroke-width="2"/>
  <!-- Flèche entrée vers le bas -->
  <polygon points="99,95 93,82 105,82" fill="#0284c7"/>

  <!-- Tuyau sortie (droite, vertical) -->
  <rect x="142" y="64" width="22" height="36" rx="6" fill="#bae6fd" stroke="#7dd3fc" stroke-width="2"/>
  <!-- Flèche sortie vers le haut -->
  <polygon points="153,65 147,78 159,78" fill="#0284c7"/>

  <!-- Vagues d'eau à l'intérieur du corps de pompe -->
  <clipPath id="bodyClip">
    <rect x="52" y="98" width="130" height="80" rx="14" ry="14"/>
  </clipPath>
  <g clip-path="url(#bodyClip)">
    <path d="M52 148 Q72 138 92 148 Q112 158 132 148 Q152 138 172 148 L172 178 L52 178 Z"
          fill="url(#waveGrad)" opacity="0.6"/>
    <path d="M52 156 Q72 146 92 156 Q112 166 132 156 Q152 146 172 156 L172 178 L52 178 Z"
          fill="#7dd3fc" opacity="0.4"/>
  </g>

</svg>
